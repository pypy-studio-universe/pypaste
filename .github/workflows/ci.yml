name: PyPaste CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pypaste-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Verify formatting and lint rules
        run: ./scripts/lint.sh

      - name: Run package tests
        run: swift test --package-path Packages/PyPasteKit

      - name: Build and run app unit tests
        run: >-
          xcodebuild test
          -workspace PyPaste.xcworkspace
          -scheme PyPaste
          -destination 'platform=macOS'
          -only-testing:PyPasteTests
          CODE_SIGNING_ALLOWED=NO
